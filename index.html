<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Black Jack</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<h1 class="title">Black Jack</h1>
<div id="gameArea">
    <div id="dealer">
        <h2 class="title">Dealer</h2>
        <div class="cards">
            <img src="playing-cards-master/clubs_2.png" alt="clubs_2">
            <img src="playing-cards-master/clubs_3.png" alt="clubs_3">
        </div>
    </div>
    <div id="player">
        <div class="cards">
            <img src="playing-cards-master/clubs_2.png" alt="clubs_2">
            <img src="playing-cards-master/clubs_3.png" alt="clubs_3">
        </div>
        <h2 class="title">Player</h2>
    </div>
    <div id="cConc" class="controls">
        <button id="double">Double</button>
        <button id="hit">Hit</button>
        <button id="stand">Stand</button>
        <button id="split">split</button>
    </div>
</div>

<script src="javascript.js"></script>
</body>
</html>
